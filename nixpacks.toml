[phases.setup]
nixPkgs = [
    "nodejs_20",
    "chromium",
    "glib",
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "cups",
    "dbus",
    "libdrm",
    "libxkbcommon",
    "mesa",
    "pango",
    "cairo",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "alsa-lib"
]

[phases.build]
cmds = ["npm install"]

[start]
cmd = "node index.js"
